# Local development database for NutsnBerries (PostgreSQL in Docker).
# Usage:  copy .env.example to .env, set NUTSNBERRIES_DB_PASSWORD, then
#         docker compose -f compose.dev.yml up -d
services:
  postgres:
    image: postgres:16.13-alpine3.23
    container_name: nutsnberries-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nutsnberries
      POSTGRES_USER: nutsnberries
      POSTGRES_PASSWORD: ${NUTSNBERRIES_DB_PASSWORD:?Set NUTSNBERRIES_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nutsnberries -d nutsnberries"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - nutsnberries-postgres-data:/var/lib/postgresql/data

volumes:
  nutsnberries-postgres-data:
